name: CI

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

# Cancel redundant CI tests automatically
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # CyberShake_jll is built for Linux and macOS only (the CyberShake sources are POSIX-only)
        version:
          - '1.11'
          - '1'
        os:
          - ubuntu-latest
          - macOS-15-intel        # Intel macOS
        arch:
          - x64
        include:
          - os: macOS-latest      # Apple silicon
            arch: aarch64
            version: '1.11'
          - os: macOS-latest
            arch: aarch64
            version: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Remove macOS quarantine from Julia artifacts
        if: runner.os == 'macOS'
        run: xattr -r -d com.apple.quarantine ~/.julia/artifacts/ || true
      - uses: julia-actions/julia-runtest@v1
